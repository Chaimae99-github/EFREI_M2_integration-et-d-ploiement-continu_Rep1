name: GitHub Actions Demo

on:
  push:

jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le repository
        uses: actions/checkout@v4

      - name: Exécuter le script Python
        run: python job.py

      - name: Créer un fichier
        run: echo "Bonjour depuis GitHub Actions" > resultat.txt

      - name: Upload de l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: mon-resultat
          path: resultat.txt

      - name: Exécuter les tests
        run: python -m unittest test_addition.py

      - name: Vérifier le secret
        run: |
          if [ -n "$SECRET_API_TOKEN" ]; then
            echo "Le secret est bien accessible"
          else
            echo "Le secret n'est pas accessible"
            exit 1
          fi
        env:
          SECRET_API_TOKEN: ${{ secrets.SECRET_API_TOKEN }}

      - name: Exécuter le script secret
        run: python job_secret.py
        env:
          SECRET_API_TOKEN: ${{ secrets.SECRET_API_TOKEN }}

      - name: Installer sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Ajouter le serveur SSH aux known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 20.56.74.49 >> ~/.ssh/known_hosts

      - name: Copier addition.py sur le serveur
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASSWORD" scp addition.py ubuntu@20.56.74.49:/home/ubuntu/ChaimaeHAJJI

      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire l'image Docker
        run: docker build -t addition-app .




